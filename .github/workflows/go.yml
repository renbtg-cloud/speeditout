name: Go checks
on:
  push:
  pull_request:
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests and tools
        run: go test ./... -count=1
      - name: Static analysis
        run: go vet ./...
      - name: Historical corpus gate
        run: go run ./cmd/regress -baseline results/v013-go-regressions.json
      - name: Race detector on Linux
        if: runner.os == 'Linux'
        run: go test -race -short ./... -count=1

  client-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript compiler
        run: npm install --no-save --no-package-lock typescript@5.9.3
      - name: Compile client transport
        run: ./node_modules/.bin/tsc -p clients/react-native-web
      - name: Test fail-closed client contract
        run: node --test clients/react-native-web/tests/*.cjs
