name: Go checks
on:
  push:
  pull_request:
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests and tools
        run: go test ./... -count=1
      - name: Static analysis
        run: go vet ./...
      - name: Historical corpus gate
        run: go run ./cmd/regress -baseline results/v013-go-regressions.json
      - name: Race detector on Linux
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1
